    <style>html,body{background:#0d1014;height:100%;margin:0;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}#hud{color:#e8edf2;white-space:pre;pointer-events:none;background:#00000073;border-radius:6px;padding:8px 10px;font:12px/1.5 ui-monospace,monospace;position:fixed;top:10px;left:10px}#crosshair{pointer-events:none;box-sizing:border-box;background:#ffffffd9;border:2px solid #0000;border-radius:50%;width:6px;height:6px;transition:width .12s,height .12s,background .12s,border-color .12s,opacity .2s;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)}#crosshair.none{opacity:.35}#crosshair.dig{width:6px;height:6px}#crosshair.use{background:0 0;border-color:#ffffffe6;width:18px;height:18px}#crosshair.enemy{background:#e6503c26;border-color:#ff6a50;border-radius:2px;width:20px;height:20px;transform:translate(-50%,-50%)rotate(45deg)}#crosshair.far{background:0 0;border-color:#ffffff59;width:14px;height:14px}#hitmark{pointer-events:none;opacity:0;width:22px;height:22px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)rotate(45deg)}#hitmark:before,#hitmark:after{content:"";background:#fff;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}#hitmark:before{width:22px;height:2px}#hitmark:after{width:2px;height:22px}#hitmark.on{opacity:1;transition:none}#hitmark{transition:opacity .25s}#hitmark.kill:before,#hitmark.kill:after{background:#ff6a50}#compass{pointer-events:none;color:#e8edf2;text-shadow:0 1px 2px #000000b3;background:linear-gradient(90deg,#0000,#00000059 20% 80%,#0000);border-radius:4px;width:360px;height:30px;font:600 12px system-ui,sans-serif;position:fixed;top:12px;left:50%;overflow:hidden;transform:translate(-50%)}#compass:after{content:"";background:#e07a2f;width:2px;height:6px;margin-left:-1px;position:absolute;top:0;left:50%}#compass span{white-space:nowrap;position:absolute;top:9px;transform:translate(-50%)}#compass span.minor{color:#8a96a3;font-size:10px;font-weight:400;top:10px}#compass span. #e07a2f;justify-self:start;width:16px;height:16px}#settings output{color:#9aa6b2;text-align:right;font:12px ui-monospace,monospace}#corelog{display:none}#overlay.showlog #corelog{display:block}#overlay.showlog #mainmenu{display:none}#logtext{color:#d8f3ef;max-height:55vh;font-size:13px;line-height:1.5;overflow:auto}#logtext p{color:#d8f3ef;border-left:2px solid #5fd3c4;margin:0 0 8px;padding-left:10px}.pop{pointer-events:none;color:#ffd27a;text-shadow:0 1px 3px #000c;font:600 13px system-ui,sans-serif;animation:1.1s ease-out forwards popup;position:fixed;top:calc(50% - 24px);left:50%;transform:translate(-50%)}@keyframes popup{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}to{opacity:0;transform:translate(-50%,-30px)}}#rest{pointer-events:none;color:#dbe7f2;text-align:center;background:#04060a8c;justify-content:center;align-items:center;font:600 20px system-ui,sans-serif;display:none;position:fixed;inset:0}#rest .sub{color:#9fb0c0;margin-top:8px;font:400 13px system-ui,sans-serif}#goal{color:#ffd27a;min-height:1em;margin-top:4px;font-size:12px}#buffs{color:#ffd27a;min-height:1em;margin-top:-4px;font-size:11px}#inv .row.gear{color:#9fd18b}#death{text-align:center}#deathhint{color:#b9c8d6;max-width:520px;margin-top:10px;font:400 15px system-ui,sans-serif}#death .sub{color:#7f8e9c;margin-top:14px;font:400 12px system-ui,sans-serif}#overlay.showsettings #settings{display:block}#overlay.showsettings #mainmenu{display:none}#status{color:#8a96a3;min-height:1em;margin-top:10px;font-size:12px}</style>

  <body>
    <div id="hud"></div>
    <div id="frost"></div><div id="hurt"></div><div id="unease"></div><div id="static"></div>
    <div id="vitals">
      <div class="row"><span>Health</span><span id="hpv"></span></div>
      <div class="bar" id="hp"><div></div></div>
      <div class="row"><span id="heatlabel">Body heat</span><span id="tempv"></span></div>
      <div class="bar" id="heat"><div></div></div>
      <div id="buffs"></div>
      <div id="goal"></div>
    </div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="captions"></div>

    <div id="inv"></div>
    <div id="hotbar"></div>
    <div id="craft"><div class="panel"><h2>Crafting</h2><p class="sub" id="craftsub"></p><div class="have" id="craftinv"></div><div id="recipes"></div><div id="craftmsg"></div></div></div>

    <div id="crosshair"></div><div id="hitmark"></div>
    <div id="compass"></div>
    <div id="core"></div>
    <div id="overlay">
      <div class="panel">
        <div id="mainmenu">
        <h1>Biocrash</h1>
        <p>The station came down hard. You walked away from it. Now survive the night.</p>
        <div class="keys" id="keylist"></div>
        <button id="play" class="primary">Click to play</button>
        <button id="export">Export save</button>
        <button id="import">Import save</button>
        <button id="reset">New world</button>
        <button id="opensettings">Settings</button>
        <button id="openlog">Core log</button>
        <button id="unstuck" title="Moves you to open ground nearby if you're wedged in the terrain">Stuck? Climb out</button>
        </div>
        <div id="corelog"><h1>Core log</h1><div id="logtext"></div><button id="closelog" class="primary">Back</button></div>
        <div id="settings"><h1>Settings</h1><div id="settingsform"></div><div id="keysform"></div><button id="closesettings" class="primary">Back</button></div>
        <div id="status"></div>
      </div>
    </div>
