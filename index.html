<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biocrash</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1014; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #hud { position: fixed; top: 10px; left: 10px; color: #e8edf2; font: 12px/1.5 ui-monospace, monospace;
             background: rgba(0,0,0,0.45); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; transform: translate(-50%,-50%);
                   border-radius: 50%; background: rgba(255,255,255,0.85); pointer-events: none;
                   transition: width 0.12s, height 0.12s, background 0.12s, border-color 0.12s, opacity 0.2s; border: 2px solid transparent; box-sizing: border-box; }
      #crosshair.none { opacity: 0.35; }
      #crosshair.dig { width: 6px; height: 6px; }
      #crosshair.use { width: 18px; height: 18px; background: transparent; border-color: rgba(255,255,255,0.9); }
      /* Enemy in reach: a red diamond, so it differs by shape as well as colour. */
      #crosshair.enemy { width: 20px; height: 20px; border-radius: 2px; transform: translate(-50%,-50%) rotate(45deg); background: rgba(230,80,60,0.15); border-color: #ff6a50; }
      #crosshair.far { width: 14px; height: 14px; background: transparent; border-color: rgba(255,255,255,0.35); }
      #hitmark { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%) rotate(45deg); pointer-events: none; opacity: 0; }
      #hitmark::before, #hitmark::after { content: ''; position: absolute; background: #fff; left: 50%; top: 50%; transform: translate(-50%,-50%); }
      #hitmark::before { width: 22px; height: 2px; } #hitmark::after { width: 2px; height: 22px; }
      #hitmark.on { opacity: 1; transition: none; } #hitmark { transition: opacity 0.25s; }
      #hitmark.kill::before, #hitmark.kill::after { background: #ff6a50; }
      #compass { position: fixed; left: 50%; top: 12px; width: 360px; height: 30px; transform: translateX(-50%); pointer-events: none; overflow: hidden;
                 background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.35) 20%, rgba(0,0,0,0.35) 80%, rgba(0,0,0,0)); border-radius: 4px;
                 color: #e8edf2; font: 600 12px system-ui, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
      #compass::after { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 6px; margin-left: -1px; background: #e07a2f; }
      #compass span { position: absolute; top: 9px; transform: translateX(-50%); white-space: nowrap; }
      #compass span.minor { color: #8a96a3; font-weight: 400; font-size: 10px; top: 10px; }
      #compass span.mark { top: 15px; font-size: 10px; font-weight: 600; }
      #core { position: fixed; right: 16px; top: 16px; width: 290px; padding: 9px 12px 10px; border-radius: 6px; pointer-events: none; display: none;
              background: rgba(6,14,18,0.62); border-left: 3px solid #5fd3c4; color: #d8f3ef; font: 13px/1.45 system-ui, sans-serif; }
      #core .tc-h { font: 600 10px ui-monospace, monospace; letter-spacing: 0.08em; color: #5fd3c4; margin-bottom: 4px; }
      #core .tc-say { min-height: 2.9em; }
      #core .tc-goal { margin-top: 7px; font-size: 12px; color: #ffd27a; }
      #core .tc-goal b { color: #fff; font-weight: 600; }
      #core .tc-box { display: inline-block; width: 11px; height: 11px; margin-right: 6px; border: 1px solid #ffd27a; border-radius: 2px;
                      font-size: 10px; line-height: 11px; text-align: center; vertical-align: -1px; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 background: rgba(8,10,14,0.72); color: #e8edf2; }
      #overlay .panel { max-width: 440px; max-height: 88vh; overflow: auto; padding: 24px 28px; background: #161b22; border-radius: 10px; }
      #overlay h1 { margin: 0 0 4px; font-size: 22px; }
      #overlay p { margin: 6px 0; font-size: 14px; color: #b9c2cc; }
      #overlay .keys { font: 13px/1.7 ui-monospace, monospace; color: #e8edf2; margin: 12px 0; white-space: pre-line; }
      #overlay button { margin: 6px 8px 0 0; padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer;
                        background: #2b3440; color: #e8edf2; font-size: 13px; }
      #overlay button.primary { background: #e07a2f; color: #111; font-weight: 600; }
      #vitals { position: fixed; left: 16px; bottom: 16px; width: 230px; color: #e8edf2; font: 12px/1.4 system-ui, sans-serif;
                pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
      .bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,0.45); margin: 3px 0 9px; overflow: hidden; }
      .bar > div { height: 100%; border-radius: 4px; transition: width 0.2s linear, background-color 0.4s; }
      #hp > div { background: #d9534f; }
      #heat > div { background: #e0a050; }
      .row { display: flex; justify-content: space-between; }
      #frost { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s;
               background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(170,205,235,0.55) 100%); }
      #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0;
              background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(150,10,10,0.6) 100%); }
      #inv .row.got { color: #ffd27a; transition: none; }
      #inv .row { transition: color 0.8s; align-items: center; }
      /* Pixel icons (Blender renders finished in Aseprite: art/aseprite/icons.lua). */
      .ico { image-rendering: pixelated; vertical-align: middle; pointer-events: none; }
      #inv .ico { width: 22px; height: 22px; margin: -3px 6px -3px -2px; }
      #inv .row > span:first-child { display: flex; align-items: center; }
      #hotbar .slot .ico { display: block; width: 40px; height: 40px; margin: 0 auto 1px; }
      #hotbar .slot.locked .ico { filter: grayscale(1) brightness(0.6); }
      #vitals .ico { width: 18px; height: 18px; margin: -3px 5px -2px 0; }
      #vitals .row > span:first-child { display: flex; align-items: center; }
      .rcost .ico, #craft .have .ico { width: 16px; height: 16px; margin: -3px 2px 0 0; }
      .rname .ico { width: 26px; height: 26px; margin: -6px 6px -4px 0; }
      #unease { position: fixed; inset: 0; pointer-events: none; opacity: 0;
                background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.85) 100%); }
      #static { position: fixed; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
                background: repeating-linear-gradient(0deg, rgba(255,255,255,0.12) 0 1px, rgba(0,0,0,0) 1px 3px),
                            repeating-linear-gradient(90deg, rgba(180,200,220,0.08) 0 2px, rgba(0,0,0,0) 2px 5px);
                animation: jitter 0.08s steps(2) infinite; }
      @keyframes jitter { 0% { transform: translate(0,0); } 50% { transform: translate(-3px,2px); } 100% { transform: translate(2px,-1px); } }
      #death { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
               background: rgba(10,16,24,0.6); color: #dbe7f2; font: 600 28px system-ui, sans-serif; letter-spacing: 0.04em; }
      #prompt { position: fixed; left: 50%; top: calc(50% + 28px); transform: translateX(-50%); color: #fff;
                font: 600 14px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,0.8); pointer-events: none; }
      #inv { position: fixed; right: 16px; bottom: 16px; width: 150px; color: #e8edf2; font: 12px/1.7 system-ui, sans-serif;
             background: rgba(0,0,0,0.35); padding: 8px 10px; border-radius: 6px; pointer-events: none; }
      :root { --ui: 1; }
      /* Interface size setting: scales every HUD panel. */
      #vitals, #inv, #hotbar, #core, #compass, #prompt, #toast, #captions, #craft .panel, #overlay .panel { zoom: var(--ui); }
      #captions { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); pointer-events: none; text-align: center; }
      #captions div { margin-top: 4px; padding: 3px 10px; background: rgba(0,0,0,0.72); color: #fff; border-radius: 4px;
                      font: 15px/1.35 system-ui, sans-serif; max-width: 38ch; display: inline-block; }
      #captions div + div { display: table; margin-left: auto; margin-right: auto; }
      .kbtn { min-width: 90px; padding: 4px 8px !important; margin: 0 !important; font: 12px ui-monospace, monospace !important; }
      #toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); color: #fff; opacity: 0;
               transition: opacity 0.4s; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px;
               font: 13px system-ui, sans-serif; pointer-events: none; }
      #hotbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; }
      #hotbar .slot { width: 86px; padding: 6px 6px 7px; border-radius: 6px; background: rgba(0,0,0,0.4); color: #e8edf2;
                      font: 12px system-ui, sans-serif; text-align: center; border: 2px solid transparent; }
      #hotbar .slot b { display: block; font-size: 10px; color: #9aa6b2; }
      #hotbar .slot.sel { border-color: #e07a2f; background: rgba(0,0,0,0.6); }
      #hotbar .slot.locked { opacity: 0.35; }
      #craft { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,10,14,0.55); }
      #craft .panel { width: 460px; max-height: 80vh; overflow: auto; padding: 18px 20px; background: #161b22; border-radius: 10px; color: #e8edf2; }
      #craft h2 { margin: 0 0 4px; font-size: 18px; }
      #craft .sub { margin: 0 0 12px; font-size: 12px; color: #8a96a3; }
      .recipe { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #262d36; }
      .rname { font-weight: 600; font-size: 14px; }
      .rcost { font-size: 12px; margin: 2px 0; } .rcost .ok { color: #9fd18b; } .rcost .no { color: #e08a7a; }
      .rblurb { font-size: 12px; color: #9aa6b2; }
      .recipe button { padding: 7px 14px; border: 0; border-radius: 6px; background: #e07a2f; color: #111; font-weight: 600; cursor: pointer; }
      .recipe button.off { background: #2b3440; color: #6b7682; cursor: default; }
      .recipe .hint { font-size: 11px; color: #8a96a3; white-space: nowrap; }
      #craft .have { font-size: 12px; color: #9aa6b2; margin: 0 0 6px; }
      #craft .have b { color: #e8edf2; font-weight: 600; }
      #craftmsg { min-height: 1.2em; margin-top: 8px; font-size: 12px; color: #ffd27a; }
      .recipe .key { display: inline-block; min-width: 14px; padding: 0 3px; margin-right: 6px; border: 1px solid #3a4450; border-radius: 3px;
                     font: 10px/14px ui-monospace, monospace; text-align: center; color: #9aa6b2; vertical-align: 1px; }
      #settings { display: none; }
      #settings .sgroup { margin: 12px 0 2px; font: 600 11px system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #8a96a3; }
      #settings .srow { display: grid; grid-template-columns: 1fr 150px 48px; align-items: center; gap: 10px; padding: 3px 0; font-size: 13px; color: #e8edf2; }
      #settings input[type=range] { width: 150px; accent-color: #e07a2f; }
      #settings input[type=checkbox] { justify-self: start; width: 16px; height: 16px; accent-color: #e07a2f; }
      #settings output { font: 12px ui-monospace, monospace; color: #9aa6b2; text-align: right; }
      #corelog { display: none; } #overlay.showlog #corelog { display: block; } #overlay.showlog #mainmenu { display: none; }
      #logtext { max-height: 55vh; overflow: auto; font-size: 13px; line-height: 1.5; color: #d8f3ef; }
      #logtext p { margin: 0 0 8px; padding-left: 10px; border-left: 2px solid #5fd3c4; color: #d8f3ef; }
      .pop { position: fixed; left: 50%; top: calc(50% - 24px); transform: translateX(-50%); pointer-events: none; color: #ffd27a;
             font: 600 13px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,0.8); animation: popup 1.1s ease-out forwards; }
      @keyframes popup { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }
      #rest { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
              background: rgba(4,6,10,0.55); color: #dbe7f2; font: 600 20px system-ui, sans-serif; text-align: center; }
      #rest .sub { margin-top: 8px; font: 400 13px system-ui, sans-serif; color: #9fb0c0; }
      #goal { font-size: 12px; color: #ffd27a; margin-top: 4px; min-height: 1em; }
      #buffs { font-size: 11px; color: #ffd27a; min-height: 1em; margin-top: -4px; }
      #inv .row.gear { color: #9fd18b; }
      #death { text-align: center; } #deathhint { margin-top: 10px; font: 400 15px system-ui, sans-serif; color: #b9c8d6; max-width: 520px; }
      #death .sub { margin-top: 14px; font: 400 12px system-ui, sans-serif; color: #7f8e9c; }
      #overlay.showsettings #settings { display: block; } #overlay.showsettings #mainmenu { display: none; }
      #status { margin-top: 10px; font-size: 12px; color: #8a96a3; min-height: 1em; }

      /* ---- HUD theme: field-kit panels, condensed labels, readable small text ---- */
      :root { --hud-bg: rgba(7, 11, 13, 0.82); --hud-line: rgba(95, 211, 196, 0.22); --hud-text: #e3eaee; --hud-dim: #93a3ad;
              --hud-accent: #e07a2f; --hud-core: #5fd3c4; --hud-danger: #ff5a4f;
              --f-label: 'Rajdhani', system-ui, sans-serif; --f-body: 'Inter', system-ui, sans-serif; --f-mono: 'Share Tech Mono', ui-monospace, monospace; }
      #vitals, #inv, #hotbar .slot, #core, #toast, #craft .panel, #overlay .panel, #prompt, #captions div { font-family: var(--f-body); }
      #vitals, #inv, #hotbar, #core { contain: layout style; }
      #inv, #hotbar .slot, #core, #toast { background: var(--hud-bg); border: 1px solid var(--hud-line);
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); border-radius: 0; }
      #vitals { padding: 8px 10px 4px; }
      #vitals .row, #inv .row { font: 600 13px/1.5 var(--f-label); letter-spacing: 0.04em; text-transform: uppercase; color: var(--hud-text); }
      #vitals .row > span:last-child, #inv .row > span:last-child { font: 600 13px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--hud-dim); }
      #inv .row > span:last-child { color: var(--hud-text); }
      #hpv { color: var(--hud-text) !important; }
      .vgroup, #inv { transition: opacity 0.6s ease, transform 0.6s ease; }
      .vgroup.faded { opacity: 0; transform: translateX(-8px); }
      #inv.faded { opacity: 0; transform: translateX(8px); }
      .bar { height: 6px; border-radius: 0; background: rgba(255,255,255,0.07); }
      .bar > div { width: 100% !important; border-radius: 0; transform-origin: left center; transition: transform 0.25s linear, background-color 0.4s; will-change: transform; }
      #buffs, #goal { font: 600 12px/1.5 var(--f-label); letter-spacing: 0.05em; }
      #hotbar .slot { font: 600 13px var(--f-label); letter-spacing: 0.04em; text-transform: uppercase; }
      #hotbar .slot b { font: 600 10px var(--f-mono); letter-spacing: 0; color: var(--hud-dim); text-transform: none; }
      #hotbar .slot.sel { border-color: var(--hud-accent); background: rgba(30, 16, 6, 0.85); box-shadow: inset 0 0 0 1px var(--hud-accent); }
      #core, #core .tc-say, #logtext { font-family: var(--f-mono) !important; }
      #core .tc-h { font-family: var(--f-mono); }
      #compass span { font-family: var(--f-label); font-weight: 600; letter-spacing: 0.06em; }
      #craft h2, #overlay h1 { font-family: var(--f-label); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .rname { font: 600 15px var(--f-label); letter-spacing: 0.03em; }
      .rcost { font-size: 12px; } .rcost b { font-weight: 600; }
      .rcost .no { color: #ff8a7a; }
      #craftfilter { float: right; margin-top: 2px; padding: 3px 9px; border: 1px solid #3a4450; border-radius: 4px; background: transparent; color: var(--hud-dim);
        font: 600 11px var(--f-label); letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; }
      #craftfilter.on { border-color: var(--hud-accent); color: var(--hud-accent); }
      #prompt { font-family: var(--f-label); font-size: 15px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="frost"></div><div id="hurt"></div><div id="unease"></div><div id="static"></div>
    <div id="vitals">
      <div id="hpgroup" class="vgroup"><div class="row"><span><img class="ico" src="icons/st_health.png" alt="">Health</span><span id="hpv"></span></div>
      <div class="bar" id="hp"><div></div></div></div>
      <div id="heatgroup" class="vgroup"><div class="row"><span><img class="ico" src="icons/st_heat.png" alt=""><span id="heatlabel">Body heat</span></span><span id="tempv"></span></div>
      <div class="bar" id="heat"><div></div></div></div>
      <div id="buffs"></div>
      <div id="goal"></div>
    </div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="captions"></div>
    <div id="rest"><div>Resting by the fire&hellip;<div class="sub">The night passes faster. Any key to get up.</div></div></div>
    <div id="inv"></div>
    <div id="hotbar"></div>
    <div id="craft"><div class="panel"><h2>Crafting <button id="craftfilter" title="F: show only what you can craft now"></button></h2><p class="sub" id="craftsub"></p><div class="have" id="craftinv"></div><div id="recipes"></div><div id="craftmsg"></div></div></div>
    <div id="death"><div><div id="deathtext">You froze.</div><div id="deathhint"></div><div class="sub">Recovering at the crash site…</div></div></div>
    <div id="crosshair"></div><div id="hitmark"></div>
    <div id="compass"></div>
    <div id="core"></div>
    <div id="overlay">
      <div class="panel">
        <div id="mainmenu">
        <h1>Biocrash</h1>
        <p>The station came down hard. You walked away from it. Now survive the night.</p>
        <div class="keys" id="keylist"></div>
        <button id="play" class="primary">Click to play</button>
        <button id="export">Export save</button>
        <button id="import">Import save</button>
        <button id="reset">New world</button>
        <button id="opensettings">Settings</button>
        <button id="openlog">Core log</button>
        <button id="unstuck" title="Moves you to open ground nearby if you're wedged in the terrain">Stuck? Climb out</button>
        </div>
        <div id="corelog"><h1>Core log</h1><div id="logtext"></div><button id="closelog" class="primary">Back</button></div>
        <div id="settings"><h1>Settings</h1><div id="settingsform"></div><div id="keysform"></div><button id="closesettings" class="primary">Back</button></div>
        <div id="status"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
