<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biocrash — M0 tech test</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1014; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #hud { position: fixed; top: 10px; left: 10px; color: #e8edf2; font: 12px/1.5 ui-monospace, monospace;
             background: rgba(0,0,0,0.45); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
                   border-radius: 50%; background: rgba(255,255,255,0.85); pointer-events: none; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 background: rgba(8,10,14,0.72); color: #e8edf2; }
      #overlay .panel { max-width: 420px; padding: 24px 28px; background: #161b22; border-radius: 10px; }
      #overlay h1 { margin: 0 0 4px; font-size: 22px; }
      #overlay p { margin: 6px 0; font-size: 14px; color: #b9c2cc; }
      #overlay .keys { font: 13px/1.7 ui-monospace, monospace; color: #e8edf2; margin: 12px 0; white-space: pre-line; }
      #overlay button { margin: 6px 8px 0 0; padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer;
                        background: #2b3440; color: #e8edf2; font-size: 13px; }
      #overlay button.primary { background: #e07a2f; color: #111; font-weight: 600; }
      #vitals { position: fixed; left: 16px; bottom: 16px; width: 230px; color: #e8edf2; font: 12px/1.4 system-ui, sans-serif;
                pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
      .bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,0.45); margin: 3px 0 9px; overflow: hidden; }
      .bar > div { height: 100%; border-radius: 4px; transition: width 0.2s linear, background-color 0.4s; }
      #hp > div { background: #d9534f; }
      #heat > div { background: #e0a050; }
      .row { display: flex; justify-content: space-between; }
      #frost { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s;
               background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(170,205,235,0.55) 100%); }
      #death { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
               background: rgba(10,16,24,0.6); color: #dbe7f2; font: 600 28px system-ui, sans-serif; letter-spacing: 0.04em; }
      #status { margin-top: 10px; font-size: 12px; color: #8a96a3; min-height: 1em; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="frost"></div>
    <div id="vitals">
      <div class="row"><span>Health</span><span id="hpv"></span></div>
      <div class="bar" id="hp"><div></div></div>
      <div class="row"><span id="heatlabel">Body heat</span><span id="tempv"></span></div>
      <div class="bar" id="heat"><div></div></div>
    </div>
    <div id="death">You froze. Recovering at the crash site…</div>
    <div id="crosshair"></div>
    <div id="overlay">
      <div class="panel">
        <h1>Biocrash</h1>
        <p>M0 tech test: smooth terrain, digging, collision and saving.</p>
        <div class="keys">WASD move · Space jump · Shift run
Left click dig · Right click fill (or E / Q)
Arrow keys also look around
T fast time · F3 debug info · F5 save now · Esc pause</div>
        <button id="play" class="primary">Click to play</button>
        <button id="export">Export save</button>
        <button id="import">Import save</button>
        <button id="reset">New world</button>
        <div id="status"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
